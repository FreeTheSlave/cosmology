<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Constellation Viewer</title>
<style>
body{
    margin:0;
    background:#050815;
    color:white;
    font-family:sans-serif;
}


canvas{
    display:block;
    width:100vw;
    height:100vh;
}
</style>
</head>
<body>


<canvas id="sky"></canvas>


<script>




const WORLD_WIDTH = 4000;
const WORLD_HEIGHT = 4000;
    
const data = {
  constellations: [
    {
      name:"The Lantern",
      color:"#ffd166",
      stars:[
        {id:"A",x:120,y:140},
        {id:"B",x:200,y:100},
        {id:"C",x:280,y:140},
        {id:"D",x:280,y:240},
        {id:"E",x:120,y:240}
      ],
      connections:[
        ["A","B"],
        ["B","C"],
        ["C","D"],
        ["D","E"],
        ["E","A"]
      ]
    },


    {
      name:"The Serpent",
      color:"#06d6a0",
      stars:[
        {id:"A",x:450,y:150},
        {id:"B",x:520,y:180},
        {id:"C",x:600,y:150},
        {id:"D",x:660,y:210},
        {id:"E",x:740,y:190},
        {id:"F",x:820,y:240}
      ],
      connections:[
        ["A","B"],
        ["B","C"],
        ["C","D"],
        ["D","E"],
        ["E","F"]
      ]
    }
  ]
};


const canvas = document.getElementById("sky");
const ctx = canvas.getContext("2d");


function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    let cameraX = 0;
    let cameraY = 0;
    draw();
}


window.addEventListener("resize",resize);


function draw(){


const gradient = ctx.createLinearGradient(
    0,0,
    canvas.width,canvas.height
);


gradient.addColorStop(0,"#000814");
gradient.addColorStop(0.5,"#040b25");
gradient.addColorStop(1,"#020510");


ctx.fillStyle = gradient;
ctx.fillRect(0,0,canvas.width,canvas.height);


for(let i=0;i<300;i++){


    const x=Math.random()*canvas.width;
    const y=Math.random()*canvas.height;


    const size=Math.random()*2;


    ctx.fillStyle="rgba(255,255,255,"+(Math.random()*0.8)+")";


    ctx.beginPath();
    ctx.arc(x,y,size,0,Math.PI*2);
    ctx.fill();
}


    for(const c of data.constellations){


        const lookup={};


        for(const star of c.stars){
            lookup[star.id]=star;
        }


        ctx.strokeStyle=c.color;
        ctx.lineWidth=2;


        for(const [a,b] of c.connections){


            const s1=lookup[a];
            const s2=lookup[b];


            ctx.beginPath();
            ctx.moveTo(
            s1.x - cameraX,
            s1.y - cameraY
        );
            ctx.lineTo(
            s2.x - cameraX,
            s2.y - cameraY
        );
            ctx.stroke();
        }
        
const nebula = ctx.createRadialGradient(
    canvas.width*0.7,
    canvas.height*0.3,
    0,
    canvas.width*0.7,
    canvas.height*0.3,
    300
);


window.addEventListener("keydown",(e)=>{


    if(e.key==="ArrowLeft") cameraX -= 50;
    if(e.key==="ArrowRight") cameraX += 50;


    if(e.key==="ArrowUp") cameraY -= 50;
    if(e.key==="ArrowDown") cameraY += 50;


    draw();
});

nebula.addColorStop(0,"rgba(80,120,255,0.15)");
nebula.addColorStop(0.5,"rgba(120,80,255,0.08)");
nebula.addColorStop(1,"rgba(0,0,0,0)");


ctx.fillStyle=nebula;
ctx.fillRect(0,0,canvas.width,canvas.height);
        for(const star of c.stars){


ctx.shadowBlur = 10;
ctx.shadowColor = "white";
ctx.fillStyle = "white";a


ctx.shadowBlur = 0;
            
            ctx.beginPath();
            ctx.arc(star.x,star.y,5,0,Math.PI*2);
            ctx.fill();
        }


        ctx.fillStyle=c.color;
        ctx.font="16px sans-serif";
        ctx.fillText(c.name,c.stars[0].x,c.stars[0].y-20);
    }
}


resize();


</script>
</body>
</html>
