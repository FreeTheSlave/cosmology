<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Constellation Viewer</title>
<style>
body{
    margin:0;
    background:#050815;
    color:white;
    font-family:sans-serif;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
}
</style>
</head>
<body>

<canvas id="sky"></canvas>

<script>
let cameraX = 0;
let cameraY = 0;

let isDragging = false;
let lastMouseX = 0;
let lastMouseY = 0;
    
const data = {
  constellations: [
    {
      name:"The Lantern",
      color:"#ffd166",
      stars:[
        {id:"A",x:120,y:140},
        {id:"B",x:200,y:100},
        {id:"C",x:280,y:140},
        {id:"D",x:280,y:240},
        {id:"E",x:120,y:240}
      ],
      connections:[
        ["A","B"],
        ["B","C"],
        ["C","D"],
        ["D","E"],
        ["E","A"]
      ]
    },

      {
  name:"The Crown",
  color:"#ff66cc",
  stars:[
    {id:"A",x:900,y:1800},
    {id:"B",x:1050,y:1600},
    {id:"C",x:1200,y:1750},
    {id:"D",x:1350,y:1600},
    {id:"E",x:1500,y:1800}
  ],
  connections:[
    ["A","B"],
    ["B","C"],
    ["C","D"],
    ["D","E"]
  ]
},

    {
      name:"The Serpent",
      color:"#06d6a0",
      stars:[
    {id:"A",x:1800,y:600},
    {id:"B",x:1950,y:700},
    {id:"C",x:2150,y:600},
    {id:"D",x:2350,y:800},
    {id:"E",x:2550,y:700},
    {id:"F",x:2750,y:900}
      ],
      connections:[
        ["A","B"],
        ["B","C"],
        ["C","D"],
        ["D","E"],
        ["E","F"]
      ]
    }
  ]
};

const canvas = document.getElementById("sky");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    draw();
}

window.addEventListener("resize",resize);

canvas.addEventListener("mousedown",(e)=>{
    isDragging = true;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
});

window.addEventListener("mouseup",()=>{
    isDragging = false;
});

window.addEventListener("mousemove",(e)=>{

    if(!isDragging) return;

    cameraX -= e.clientX - lastMouseX;
    cameraY -= e.clientY - lastMouseY;

    lastMouseX = e.clientX;
    lastMouseY = e.clientY;

    draw();
});
    
function draw(){

const gradient = ctx.createLinearGradient(
    0,0,
    canvas.width,canvas.height
);

gradient.addColorStop(0,"#000814");
gradient.addColorStop(0.5,"#040b25");
gradient.addColorStop(1,"#020510");

ctx.fillStyle = gradient;
ctx.fillRect(0,0,canvas.width,canvas.height);

for(let i=0;i<300;i++){

    const x=Math.random()*canvas.width;
    const y=Math.random()*canvas.height;

    const size=Math.random()*2;

    ctx.fillStyle="rgba(255,255,255,"+(Math.random()*0.8)+")";

    ctx.beginPath();
    ctx.arc(x,y,size,0,Math.PI*2);
    ctx.fill();
}

    for(const c of data.constellations){

        const lookup={};

        for(const star of c.stars){
            lookup[star.id]=star;
        }

        ctx.strokeStyle=c.color;
        ctx.lineWidth=2;

        for(const [a,b] of c.connections){

            const s1=lookup[a];
            const s2=lookup[b];

            ctx.beginPath();
            ctx.moveTo(
    s1.x - cameraX,
    s1.y - cameraY
);
           ctx.lineTo(
    s2.x - cameraX,
    s2.y - cameraY
);
            ctx.stroke();
        }
        
const nebula = ctx.createRadialGradient(
    canvas.width*0.7,
    canvas.height*0.3,
    0,
    canvas.width*0.7,
    canvas.height*0.3,
    300
);

nebula.addColorStop(0,"rgba(80,120,255,0.15)");
nebula.addColorStop(0.5,"rgba(120,80,255,0.08)");
nebula.addColorStop(1,"rgba(0,0,0,0)");

ctx.fillStyle=nebula;
ctx.fillRect(0,0,canvas.width,canvas.height);
        for(const star of c.stars){

ctx.shadowBlur = 10;
ctx.shadowColor = "white";
ctx.fillStyle = "white";

ctx.shadowBlur = 0;
            
            ctx.beginPath();
            ctx.arc(
    star.x - cameraX,
    star.y - cameraY,
    5,
    0,
    Math.PI*2
);
            ctx.fill();
        }

        ctx.fillStyle=c.color;
        ctx.font="16px sans-serif";
        ctx.fillText(
    c.name,
    c.stars[0].x - cameraX,
    c.stars[0].y - 20 - cameraY
);
    }
}

resize();

</script>
</body>
</html>
